defaults:
  - task: uav_pecnet_lowdim_30hist_30future_structured_anchor_relpos
  - _self_

name: train_uav_pecnet_lowdim_30hist_30future_structured_accel_residual_anchor_diffusion
task_name: ${task.name}

anchor_horizon: 5
full_future_steps: 30
n_obs_steps: 30
pred_action_steps_only: True
structured_cond_dim: 256
relation_hidden_dim: 128
anchor_steps: [6, 12, 18, 24, 30]
stage2_start_frac: 0.6
traj_ade_loss_weight_max: 5.0e-4
traj_fde_loss_weight_max: 1.0e-3
curriculum_mode: linear_ramp
base_mode: accel
base_velocity_window: 3
base_accel_window: 3
base_accel_clip: null

policy:
  _target_: diffusion_policy.policy.structured_uav_accel_residual_anchor_diffusion_policy.StructuredUAVAccelResidualAnchorDiffusionPolicy
  horizon: ${anchor_horizon}
  n_obs_steps: ${n_obs_steps}
  n_action_steps: ${anchor_horizon}
  full_future_steps: ${full_future_steps}
  anchor_steps: ${anchor_steps}
  obs_dim: ${task.obs_dim}
  action_dim: ${task.action_dim}
  obs_as_cond: True
  pred_action_steps_only: ${pred_action_steps_only}
  velocity_loss_weight: 0.0
  short_horizon_loss_weight: 0.0
  terminal_pos_loss_weight: 0.0
  relative_path_loss_weight: 0.0
  action_target_type: relative_future_position
  stage2_start_frac: ${stage2_start_frac}
  traj_ade_loss_weight_max: ${traj_ade_loss_weight_max}
  traj_fde_loss_weight_max: ${traj_fde_loss_weight_max}
  curriculum_mode: ${curriculum_mode}
  base_mode: ${base_mode}
  base_velocity_window: ${base_velocity_window}
  base_accel_window: ${base_accel_window}
  base_accel_clip: ${base_accel_clip}
  structured_obs_encoder:
    _target_: diffusion_policy.model.diffusion.structured_uav_obs_encoder.StructuredUAVObsEncoder
    max_agents: 6
    agent_state_dim: 7
    team_dim: 2
    slot_count: 6
    role_count: 4
    hidden_dim: ${structured_cond_dim}
    relation_hidden_dim: ${relation_hidden_dim}
    num_heads: 4
    dropout: 0.1
  model:
    _target_: diffusion_policy.model.diffusion.transformer_for_diffusion.TransformerForDiffusion
    input_dim: ${task.action_dim}
    output_dim: ${task.action_dim}
    horizon: ${anchor_horizon}
    n_obs_steps: ${n_obs_steps}
    cond_dim: ${structured_cond_dim}
    n_layer: 8
    n_head: 8
    n_emb: 256
    p_drop_emb: 0.1
    p_drop_attn: 0.1
    n_cond_layers: 4
    causal_attn: True
    time_as_cond: True
    obs_as_cond: True
  num_inference_steps: 10
  noise_scheduler:
    _target_: diffusers.schedulers.scheduling_ddim.DDIMScheduler
    num_train_timesteps: 100
    beta_start: 0.0001
    beta_end: 0.02
    beta_schedule: linear
    clip_sample: True
    set_alpha_to_one: True
    steps_offset: 0
    prediction_type: epsilon

training:
  device: "cuda:3"
  seed: 123
  debug: False
  resume: False
  num_epochs: 80
  gradient_accumulate_steps: 1
  lr: 3e-5
  lr_scheduler: cosine
  lr_warmup_steps: 500
  weight_decay: 1.0e-3
  checkpoint_every: 10
  gradient_accumulate_every: 1
  use_ema: True
  rollout_every: 10
  val_every: 10
  sample_every: 20
  max_train_steps: null
  max_val_steps: null
  tqdm_interval_sec: 1.0

optimizer:
  learning_rate: ${training.lr}
  weight_decay: 1.0e-4
  betas: [0.9, 0.95]

ema:
  _target_: diffusion_policy.model.diffusion.ema_model.EMAModel
  update_after_step: 0
  inv_gamma: 1.0
  power: 0.75
  min_value: 0.0
  max_value: 0.9999

logging:
  project: diffusion_policy_debug
  resume: True
  mode: disabled
  name: ${now:%Y.%m.%d-%H.%M.%S}_${name}_${task_name}
  tags: ["${name}", "${task_name}", "structured_cond", "30hist_30future", "accel_residual_anchor_diffusion"]
  id: null
  group: null

checkpoint:
  topk:
    monitor_key: eval_traj_path_error_pct
    mode: min
    k: 5
    format_str: "epoch={epoch:04d}-eval_traj_path_error_pct={eval_traj_path_error_pct:.3f}.ckpt"
  save_last_ckpt: True
  save_last_snapshot: False

dataloader:
  batch_size: 256
  num_workers: 8
  shuffle: True
  pin_memory: True
  persistent_workers: True

val_dataloader:
  batch_size: 256
  num_workers: 4
  shuffle: False
  pin_memory: True
  persistent_workers: True

_target_: diffusion_policy.workspace.train_diffusion_transformer_lowdim_workspace.TrainDiffusionTransformerLowdimWorkspace
